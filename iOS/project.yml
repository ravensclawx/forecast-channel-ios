# Generate with: cd iOS && xcodegen  (after tools/ios/stage_assets.sh)
# Signing / bundle ID: copy Local.xcconfig.example to Local.xcconfig (gitignored) and set your team.
name: ForecastPhone
options:
  bundleIdPrefix: com.ravensclawx
  deploymentTarget:
    iOS: "17.0"
packages:
  ForecastChannel:
    path: ..
targets:
  ForecastPhone:
    type: application
    platform: iOS
    sources:
      - path: ForecastPhone
      - path: Resources/Nintendo
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: ForecastChannel
        product: Forecast
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_NAME: ForecastPhone
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Forecast Channel
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Forecast Channel uses your location to show the weather for the closest city.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ForecastPhone/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleDisplayName: Forecast Channel
        NSLocationWhenInUseUsageDescription: Forecast Channel uses your location to show the weather for the closest city.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
